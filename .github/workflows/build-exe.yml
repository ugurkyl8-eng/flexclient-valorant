name: Build FlexClient EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build FlexClient.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FlexClient app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlexClient-windows
          path: dist/FlexClient.exe
          if-no-files-found: error
